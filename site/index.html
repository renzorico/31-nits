<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The 31-Night Line: Barcelona's Airbnb listings and the housing rules</title>
    <meta
      name="description"
      content="Barcelona's Airbnb listings split in two: one night, or a month and more. An atlas of four quarterly snapshots, the tourist-flat register and official rents, in English, Spanish and Catalan."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f5f0" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="__SITE_URL__" />
    <link rel="alternate" hreflang="en" href="__SITE_URL__?lang=en" />
    <link rel="alternate" hreflang="es" href="__SITE_URL__?lang=es" />
    <link rel="alternate" hreflang="ca" href="__SITE_URL__?lang=ca" />

    <!-- Social previews (LinkedIn, Open Graph). __SITE_URL__ is filled in at build time (vite.config.ts). -->
    <meta property="og:type" content="article" />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:title" content="The 31-Night Line · La línia de les 31 nits" />
    <meta
      property="og:description"
      content="41.7% of Barcelona's Airbnb listings with open dates ask for 31 nights or more, against 2–8% in four other Spanish cities. In English, Spanish and Catalan."
    />
    <meta property="og:image" content="__SITE_URL__og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bar chart: Barcelona Airbnb listings by minimum stay, with peaks at 1 night and at 31 and 32 nights."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <a class="skip-link" id="skip" href="#main">Skip to the content</a>
    <div class="banner" id="banner">
      <span class="note" id="banner-note"><b>The 31-Night Line</b></span>
      <nav class="lang" id="lang" aria-label="Language"></nav>
    </div>
    <div id="tip" role="status" aria-live="polite"></div>

    <main id="main" tabindex="-1">
      <header class="screen hero" id="top">
        <h1 id="hero-title">4 in 10 Barcelona Airbnb listings ask guests to stay a month or more.</h1>
        <p class="byline" id="byline"></p>
        <p class="lede" id="hero-lede"></p>
      </header>

      <section class="screen" id="wall" aria-labelledby="wall-title">
        <div class="wrap head">
          <h2 id="wall-title"></h2>
          <p class="sub" id="wall-sub"></p>
          <details class="how"><summary></summary><p id="wall-how"></p></details>
        </div>
        <ul class="legend" id="wall-legend"></ul>
        <div class="fill" id="wall-chart" role="img"></div>
      </section>

      <section class="screen" id="atlas" aria-labelledby="atlas-title">
        <div class="wrap head">
          <h2 id="atlas-title"></h2>
          <p class="sub" id="atlas-sub"></p>
          <details class="how"><summary></summary><p id="atlas-how"></p></details>
        </div>
        <div class="ramp" id="atlas-ramp"></div>
        <div class="fill" id="atlas-chart" role="img"></div>
        <details class="explore" id="explore">
          <summary id="explore-summary"></summary>
          <div class="explore-body">
            <ul class="legend" id="map-legend"></ul>
            <div id="map" role="img"></div>
            <p class="sub" id="map-how"></p>
          </div>
        </details>
      </section>

      <section class="screen" id="price" aria-labelledby="price-title">
        <div class="wrap head">
          <h2 id="price-title"></h2>
          <p class="sub" id="price-sub"></p>
          <details class="how"><summary></summary><p id="price-how"></p></details>
        </div>
        <ul class="legend" id="price-legend"></ul>
        <div class="fill" id="price-chart" role="img"></div>
      </section>

      <section class="screen" id="hosts" aria-labelledby="hosts-title">
        <div class="wrap head">
          <h2 id="hosts-title"></h2>
          <p class="sub" id="hosts-sub"></p>
          <details class="how"><summary></summary><p id="hosts-how"></p></details>
        </div>
        <div class="ramp" id="hosts-ramp"></div>
        <div class="fill" id="hosts-chart" role="img"></div>
      </section>

      <section class="screen" id="flows" aria-labelledby="flows-title">
        <div class="wrap head">
          <h2 id="flows-title"></h2>
          <p class="sub" id="flows-sub"></p>
          <details class="how"><summary></summary><p id="flows-how"></p></details>
        </div>
        <ul class="legend" id="flows-legend"></ul>
        <div class="fill" id="flows-chart" role="img"></div>
      </section>

      <section class="screen" id="gap" aria-labelledby="gap-title">
        <div class="wrap head">
          <h2 id="gap-title"></h2>
          <p class="sub" id="gap-sub"></p>
          <details class="how"><summary></summary><p id="gap-how"></p></details>
        </div>
        <ul class="legend" id="gap-legend"></ul>
        <div class="fill" id="gap-chart" role="img"></div>
      </section>

      <section class="screen" id="licences" aria-labelledby="licences-title">
        <div class="wrap head">
          <h2 id="licences-title"></h2>
          <p class="sub" id="licences-sub"></p>
          <details class="how"><summary></summary><p id="licences-how"></p></details>
        </div>
        <ul class="legend" id="licences-legend"></ul>
        <div class="fill" id="licences-chart" role="img"></div>
      </section>

      <section class="screen" id="register" aria-labelledby="register-title">
        <div class="wrap head">
          <h2 id="register-title"></h2>
          <p class="sub" id="register-sub"></p>
          <details class="how"><summary></summary><p id="register-how"></p></details>
        </div>
        <div class="ramp" id="register-ramp"></div>
        <div class="fill" id="register-chart" role="img"></div>
      </section>

      <section class="screen" id="rents" aria-labelledby="rents-title">
        <div class="wrap head">
          <h2 id="rents-title"></h2>
          <p class="sub" id="rents-sub"></p>
          <details class="how"><summary></summary><p id="rents-how"></p></details>
        </div>
        <ul class="legend" id="rents-legend"></ul>
        <div class="fill" id="rents-chart" role="img"></div>
      </section>

      <section class="screen" id="rules" aria-labelledby="rules-title">
        <div class="wrap head">
          <h2 id="rules-title"></h2>
          <p class="sub" id="rules-sub"></p>
        </div>
        <div class="fill" id="rules-chart" role="img"></div>
        <div class="wrap rule-detail" id="rule-detail" aria-live="polite"></div>
      </section>

      <section class="screen" id="method" aria-labelledby="method-title">
        <div class="wrap head">
          <h2 id="method-title"></h2>
          <p class="sub" id="method-sub"></p>
        </div>
        <div class="wrap">
          <ol class="steps" id="pipeline"></ol>
          <details class="how">
            <summary id="all-caveats"></summary>
            <ul class="plain" id="caveats"></ul>
            <ul class="plain" id="sources"></ul>
          </details>
        </div>
        <div class="wrap">
          <div class="endnote">
            <p id="endnote-caveat"></p>
            <footer id="footer-links"></footer>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
